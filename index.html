<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Tic Tack Toe Project</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="gameContainer">
        <div class="header">
            <button id="restart" class="btn">Restart</button>
            <div class="playersContainer">
                <div class="player" data-player-number="1">
                    <div class="turnIndicator"></div>
                    <div>
                        <p class="status"></p>
                        <p class="token">X</p>
                        <p class="name">Player 1</p>
                    </div>
                </div>
                <div class="player" data-player-number="2">
                    <div class="turnIndicator"></div>
                    <div>
                        <p class="status"></p>
                        <p class="token">O</p>
                        <p class="name">Player 2</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="boardContainer">
            <div class="grid">
                <div class="cell" data-board-index="0"></div>
                <div class="cell" data-board-index="1"></div>
                <div class="cell" data-board-index="2"></div>
                <div class="cell" data-board-index="3"></div>
                <div class="cell" data-board-index="4"></div>
                <div class="cell" data-board-index="5"></div>
                <div class="cell" data-board-index="6"></div>
                <div class="cell" data-board-index="7"></div>
                <div class="cell" data-board-index="8"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
