<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Tic Tack Toe Project</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="gameContainer">
        <div class="header">
            <div class="player1">
                Player 1 (X)
            </div>
            <div class="player2">
                Player 2 (O)
            </div>
        </div>
        <div class="boardContainer">
            <div class="cell" data-row="1" data-col="1">X</div>
            <div class="cell" data-row="1" data-col="2">O</div>
            <div class="cell" data-row="1" data-col="3"></div>
            <div class="cell" data-row="2" data-col="1"></div>
            <div class="cell" data-row="2" data-col="2"></div>
            <div class="cell" data-row="2" data-col="3"></div>
            <div class="cell" data-row="3" data-col="1"></div>
            <div class="cell" data-row="3" data-col="2"></div>
            <div class="cell" data-row="3" data-col="3"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
